services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MAX_TOKENS_PER_REQUEST: ${AI_MAX_TOKENS_PER_REQUEST:-2048}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_HOURLY_TOKEN_LIMIT: ${AI_HOURLY_TOKEN_LIMIT:-100000}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-1000000}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-5}
      CACHE_DECODE_TTL: ${CACHE_DECODE_TTL:-86400}
      CACHE_PROFILE_TTL: ${CACHE_PROFILE_TTL:-3600}
      DEDUP_WINDOW_MS: ${DEDUP_WINDOW_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis-data: